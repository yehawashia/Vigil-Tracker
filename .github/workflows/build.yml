name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # only used to attach the .zip to tagged releases

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app (arm64 + x86_64)
        run: UNIVERSAL=1 ./build.sh --zip

      - name: MCP smoke test
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | build/Vigil.app/Contents/MacOS/vigil-mcp | tee mcp.out
          grep -q '"get_daily_summary"' mcp.out

      - uses: actions/upload-artifact@v4
        with:
          name: Vigil-macOS
          path: build/Vigil-macOS.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 build/Vigil-macOS.zip > build/Vigil-macOS.zip.sha256
          gh release create "$GITHUB_REF_NAME" build/Vigil-macOS.zip build/Vigil-macOS.zip.sha256 \
            --title "Vigil $GITHUB_REF_NAME" --generate-notes

  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit + loopback network tests
        run: swift test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iPhone/iPad app (free spec, unsigned)
        run: |
          cd iOS
          xcodegen --spec project-free.yml
          xcodebuild -project Vigil.xcodeproj -scheme Vigil -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -40; test ${PIPESTATUS[0]} -eq 0
      - name: Build full app with Screen Time + extensions (unsigned)
        run: |
          cd iOS
          rm -rf Vigil.xcodeproj
          xcodegen --spec project.yml
          xcodebuild -project Vigil.xcodeproj -scheme Vigil -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -40; test ${PIPESTATUS[0]} -eq 0
